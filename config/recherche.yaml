# Réglages de la recherche. Modifiable directement sur GitHub (icône crayon).

# Heure d'envoi du condensé quotidien (heure de Paris)
heure_condense: 10

# Nombre maximum de nouvelles offres analysées par l'IA chaque jour
# (les modèles gratuits ont un quota quotidien limité)
max_analyses_par_jour: 60

# Ordre d'essai des modèles gratuits OpenRouter (le suivant prend le relais si l'un est saturé)
modeles:
  - nvidia/nemotron-3-super-120b-a12b:free
  - google/gemma-4-31b-it:free
  - google/gemma-4-26b-a4b-it:free
  - nvidia/nemotron-3-ultra-550b-a55b:free

sources:
  # Flux RSS officiel du CNRS (toutes les offres, CDD ingénieurs et contrats doctoraux)
  cnrs: true

  # INRAE : toutes les offres de jobs.inrae.fr (CDD, thèses), lues via le plan du site autorisé aux robots
  inrae: true

  # ABG : offres de thèse (biologie, écologie, neurosciences, santé animale, agronomie, données)
  abg: true

  # Choisir le service public : offres du MNHN (toutes) et recherche par mots-clés
  # dans toute la fonction publique (INRAE, universités, OFB, Anses…). Le site autorise la lecture des offres.
  choisir_le_service_public:
    actif: true
    motscles: ["mnhn", "biostatistique", "biostatisticien", "comportement animal", "éthologie", "écologie",
               "biodiversité", "génétique des populations", "zebrafish", "ingénieur d'études biologie"]
    pages: 1        # 20 offres les plus récentes par mot-clé
    pages_mnhn: 3   # le MNHN publie une trentaine d'offres à la fois

  # Alertes e-mail reçues dans Gmail : Indeed, LinkedIn, Welcome to the Jungle, APEC,
  # France Travail, ABG, EURAXESS, INRAE, Choisir le service public...
  # Le robot lit uniquement le libellé Gmail indiqué ci-dessous.
  alertes_mail:
    actif: true
    libelle_gmail: "Alertes emploi"
    jours: 3
    # Ménage : les mails d'alertes et des sites d'emploi (récaps, relances, newsletters) partent à la
    # corbeille de Gmail (récupérables 30 jours) une fois leurs offres recopiées sur le site.
    # Les mails qui parlent de candidature, d'entretien, de convocation ou les messages de recruteurs
    # ne sont jamais touchés. essai = liste seulement dans le condensé ; actif = corbeille ; non = rien.
    menage: essai

  # API France Travail (s'active toute seule quand l'accès sera accordé et les clés ajoutées)
  france_travail:
    motscles: ["biostatisticien", "ingénieur d'études biologie", "ingénieur de recherche biologie",
               "écologie", "comportement animal", "biodiversité", "analyse de données biologie"]
    departements: ["75", "77", "78", "91", "92", "93", "94", "95"]

  # Jooble : moteur qui regroupe de nombreux sites d'emploi (clé gratuite, quota de 500 requêtes :
  # on en utilise 3 par jour, plus 1 par recherche lancée depuis le site)
  jooble:
    actif: true
    appels_par_jour: 3

  # Autres flux RSS à ajouter librement (une adresse par ligne)
  rss_supplementaires: []

# Mots-clés qui augmentent l'intérêt d'une offre (préfiltre avant l'IA). Poids de 1 à 5.
mots_cles:
  5: ["comportement", "éthologie", "ethologie", "behaviour", "behavior", "biostatisti", "primat",
      "écologie comportementale", "cognition animale", "bien-être animal", "zebrafish", "poisson zèbre"]
  4: ["écologie", "ecologie", "ecology", "biodiversité", "biodiversity", "faune", "wildlife",
      "conservation", "génétique des populations", "population genetics", "modèles mixtes", "glmm",
      " r ", "statisti", "analyse de données", "data analys", "modélisation", "modelling", "modeling"]
  3: ["biologie", "biology", "animal", "zoologie", "évolution", "evolution", "neurosciences",
      "épidémiologie", "santé animale", "one health", "sciences participatives", "vigie-nature",
      "ingénieur d'étude", "ingénieur d’étude", "ingénieur de recherche", "data manager",
      "muséum", "mnhn", "inrae", "anses", "ofb"]
  1: ["médiation scientifique", "biologiste", "environnement", "terrain"]

# Offres écartées d'office (dans le titre)
exclusions:
  - "stage"
  - "stagiaire"
  - "convention de stage"
  - "alternance"
  - "alternant"
  - "apprenti"
  - "apprentissage"
  - "post-doc"
  - "postdoc"
  - "post doc"
  - "postdoctor"
  - "post-doctor"
  - "mobilité interne"
  - "volontariat"
  - "service civique"
  - "bénévol"
