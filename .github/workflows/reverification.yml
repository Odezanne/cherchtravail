name: Revérification des offres

# Rouvre chaque offre affichée sur son site d'origine (et chez l'employeur) et retire celles qui ne sont plus en ligne.
# En plus du passage du matin : chaque jour en début d'après-midi, et à la demande.
on:
  schedule:
    - cron: "10 12 * * *"
  workflow_dispatch:
    inputs:
      manuel_seul:
        description: "Appliquer seulement les vérifications faites par Didier (rapide)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  reverifier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      change: ${{ steps.commit.outputs.change }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pypdf
      - name: Rouvrir chaque offre
        env:
          DONNEES_TOKEN: ${{ secrets.DONNEES_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MANUEL_SEUL: ${{ github.event_name == 'workflow_dispatch' && inputs.manuel_seul && '1' || '0' }}
        run: python robot/reverifier.py
      - name: Enregistrer
        id: commit
        run: |
          git config user.name "cherchtravail-robot"
          git config user.email "robot@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "change=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Revérification des offres du $(TZ=Europe/Paris date +%d/%m/%Y)"
            git pull --rebase -q && git push
            echo "change=true" >> "$GITHUB_OUTPUT"
          fi

  site:
    needs: reverifier
    if: needs.reverifier.outputs.change == 'true'
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
